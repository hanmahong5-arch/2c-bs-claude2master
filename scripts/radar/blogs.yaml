    handle: oneusefulthing
    type: rss
    url: https://www.oneusefulthing.org/feed
    pollDays: 2

  - author: Jack Clark
    handle: importai
    type: rss
    url: https://importai.substack.com/feed
    pollDays: 2

  - author: Zvi Mowshowitz
    handle: thezvi
    type: rss
    url: https://thezvi.substack.com/feed
    pollDays: 2

  # ── 官方 AI lab news / blog ──
  - author: OpenAI
    handle: openai-news
    type: rss
    url: https://openai.com/news/rss.xml
    pollDays: 1
    category: lab

  - author: Google DeepMind
    handle: deepmind
    type: rss
    url: https://deepmind.google/blog/rss.xml
    pollDays: 2
    category: lab

  - author: Hugging Face
    handle: hf-blog
    type: rss
    url: https://huggingface.co/blog/feed.xml
    pollDays: 2
    category: company

  # 2026-09-23: newsroom 已服务端渲染 (curl 可见文章链接) → lightpanda 改 html, CI 不再起浏览器。
  - author: Anthropic
    handle: anthropic-news
    type: html
    url: https://www.anthropic.com/news
    linkPattern: '^/news/[a-z0-9-]+$'
    pollDays: 1
    category: lab

  # ── Agent 运行时专区 观点源 (品类 agent-runtime; RSS 经 2026-06-29 逐个 fetch 验证) ──
  # OpenClaw 作者 Peter Steinberger 个人博客 — 注: 可用路径是 /rss.xml (/feed /atom.xml 均 404)。
  - author: Peter Steinberger
    handle: steipete
    type: rss
    url: https://steipete.me/rss.xml
    pollDays: 2

  # OpenClaw 官方项目博客 (发版/安全/生态); /rss.xml 可用 (/blog/rss.xml 404)。
  - author: OpenClaw
    handle: openclaw-blog
    type: rss
    url: https://openclaw.ai/rss.xml
    pollDays: 2
    category: company

  # ══ 2026-09-23 扩源: AI 原生公司 / 框架 / 模型厂官方博客 ══════════════════════
