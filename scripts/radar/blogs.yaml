  # category: lab = 模型实验室 · company = AI 原生公司/框架 · person = 个人 (缺省)
  # include: 全站 feed 只收 AI 相关 (标题+正文正则, 不区分大小写); 不相关的标 seen 不出稿。
  # html 源: SSR 列表页无 feed → linkPattern 筛文章链接, 文章页须能取到发布日期才收。

