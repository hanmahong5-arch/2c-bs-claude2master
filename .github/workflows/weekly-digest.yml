name: Weekly Digest

# Plan §3 — 半自动层 (观点 chore, 必须人审)
# 周一 08:00 CN (00:00 UTC) 扫过去 7 天 changelog → LLM 综合 weekly digest 草稿
# bot 在 auto-radar/digest-<slug> 分支写 MDX → gh pr create --label auto-radar
# Owner 手机 review + merge 才会触发 Vercel build
#
# 与 daily-radar 区别: 后者直推 main, 这里强制开 PR
# 已存在的 digest 不重复跑 LLM (idempotent)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  digest:
    name: Generate weekly digest PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整 history, 否则 git push 新分支会 fail
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate digest draft
        id: gen
        env:
          NEWAPI_TRIAL_TOKEN: ${{ secrets.NEWAPI_TRIAL_TOKEN }}
          NEWAPI_BASE_URL: https://newapi.lurus.cn
          RADAR_MODEL_ID: deepseek-v3-2-251201
        run: |
          set -euo pipefail
          if [ -z "${NEWAPI_TRIAL_TOKEN}" ]; then
            echo "::error::NEWAPI_TRIAL_TOKEN secret not set"
            exit 1
          fi
          # stdout 契约: 正常模式只输出 slug 单行; "已存在" / "无 changelog" 时无输出
          slug=$(bun run scripts/radar/digest-draft.ts || true)
          if [ -z "${slug}" ]; then
            echo "[digest] no slug produced (lookback empty or file exists); skipping PR"
            echo "slug=" >> "$GITHUB_OUTPUT"
          else
            echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch + commit + PR
        if: steps.gen.outputs.slug != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          slug="${{ steps.gen.outputs.slug }}"
          branch="auto-radar/digest-${slug}"

          git config user.name "c2m-radar-bot"
          git config user.email "radar-bot@claude2master.com"

          # Branch 已存在 → 上次 PR 还没 merge, 这周不再开新 PR
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "[digest] branch ${branch} already on remote; skipping PR"
            exit 0
          fi

          git checkout -b "${branch}"
          # Path filter: 只允许 digest 目录
          git add src/content/digest/
          if git diff --staged --quiet; then
            echo "[digest] no staged diff; aborting"
            exit 0
          fi
          git commit -m "chore(digest): weekly draft ${slug}" \
                     -m "Auto-generated by weekly-digest workflow · model deepseek-v3-2-251201"
          git push -u origin "${branch}"

          gh pr create \
            --title "[digest] ${slug}" \
            --body "$(cat <<EOF
本周 Weekly Digest 自动草稿。

- **生成时间**: $(date -u +%Y-%m-%dT%H:%MZ)
- **模型**: deepseek-v3-2-251201 (via newapi)
- **frontmatter**: authored=hybrid (需要编辑校稿后再 merge)

## 审核 checklist

- [ ] 标题与本周主基调一致
- [ ] 逐条速览的原文链接正确
- [ ] 设计趋势那段有具体证据
- [ ] 无幻觉 / 无未提到的功能
- [ ] 钩子 ≤ 60 字

Merge 后 Vercel 自动 build → /weekly/${slug} 上线。
EOF
)" \
            --label auto-radar \
            --base main \
            --head "${branch}"

      # W5 — 非阻塞 step: 把当前 main 最新一份 digest 推到 buttondown 当 draft
      # 用 main checkout (PR 还没 merge), 实际推的是上一周已 merge 的 digest
      # owner 在 buttondown dashboard 手动 schedule send
      - name: Push latest merged digest to buttondown as draft
        if: always()
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTTONDOWN_API_KEY:-}" ]; then
            echo "[newsletter] BUTTONDOWN_API_KEY not set; skipping"
            exit 0
          fi
          # 切回 main, 拿已 merge 的最新 digest (不是这次 PR 的草稿)
          git checkout main
          # 非阻塞: 任何失败都不让整个 workflow 红
          bun run scripts/radar/mdx-to-newsletter.ts || \
            echo "[newsletter] mdx-to-newsletter failed; non-blocking, continuing"

      - name: Notify wechatwork on failure
        if: failure() && env.WECHATWORK_WEBHOOK_URL != ''
        env:
          WECHATWORK_WEBHOOK_URL: ${{ secrets.WECHATWORK_WEBHOOK_URL }}
        run: |
          content="⚠️ **c2m weekly-digest FAILED** ($(date -u +%Y-%m-%d))\n\nrun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(jq -nc --arg c "$content" '{msgtype: "markdown", markdown: {content: $c}}')
          curl -sf -X POST -H 'Content-Type: application/json' -d "$payload" "$WECHATWORK_WEBHOOK_URL" || echo "wechatwork push failed"
