name: Daily Radar

# Plan §3 — 全自动层
# 每天 09:30 CN (01:30 UTC) 抓 anthropics/claude-code + openai/codex 新 release
# LLM 中文摘要 → 写 src/content/changelog/*.mdx → bot commit 直推 main
# → 显式 POST Vercel Deploy Hook 触发部署 (git push 不会自动 build, 见下 Trigger 步骤)
#
# Path filter: 只动 src/content/changelog/ + scripts/radar/state.json
# 失败告警: WECHATWORK_WEBHOOK_URL (复用 lurus daily-audit)
# 当日无新 release → exit 0, 不 commit, 不触发部署

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/radar/**'
      - '.github/workflows/daily-radar.yml'

jobs:
  radar:
    name: Fetch + summarize + commit
    runs-on: ubuntu-latest
    # 20min: 15 博主源 × 5 条 × ~14s LLM 摘要的最坏批次 >10min, 曾致 4 连 cancel 死循环 (2026-06-10)
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch new releases
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out=$(bash scripts/radar/fetch-releases.sh)
          rc=$(printf '%s' "$out" | grep -c . || true)
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 多行字符串通过文件传递, 避免 GITHUB_OUTPUT 转义问题
          printf '%s\n' "$out" > radar-new-releases.jsonl
          echo "---- fetched $rc release(s) ----"
          cat radar-new-releases.jsonl

      - name: Fetch new practices (Anthropic Engineering / Claude Code docs / Codex blog)
        id: practices
        run: |
          set -euo pipefail
          # 失败不阻塞 release 路径 (practices 是补充, 不是主路径)
          bun run scripts/radar/fetch-practices.ts > radar-new-practices.jsonl || true
          # 注意: `grep -c` 空文件输出 "0" 但退出码 1; 若再 `|| echo 0` 会双计数成多行 "0\n0",
          # 写进 $GITHUB_OUTPUT 触发 "Invalid format" 让步骤失败。用 `|| true` + 默认值兜底。
          pc=$(grep -c . radar-new-practices.jsonl 2>/dev/null || true); pc=${pc:-0}
          echo "pc=$pc" >> "$GITHUB_OUTPUT"
          echo "---- fetched $pc practice(s) ----"
          cat radar-new-practices.jsonl 2>/dev/null || true

      - name: Fetch trending repos (GitHub Search API)
        id: trending
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 失败不阻塞主路径 (trending 是补充, 同 practices)
          bun run scripts/radar/fetch-trending.ts > radar-new-trending.jsonl || true
          tc=$(grep -c . radar-new-trending.jsonl 2>/dev/null || true); tc=${tc:-0}
          echo "tc=$tc" >> "$GITHUB_OUTPUT"
          echo "---- fetched $tc trending ----"
          cat radar-new-trending.jsonl 2>/dev/null || true

      # 仅当 blogs.yaml 含 lightpanda 源时才起浏览器 — 避免每天空跑 docker 浪费 CI。
      - name: Detect lightpanda sources
        id: lp
        run: |
          set -euo pipefail
          if grep -qE '^[[:space:]]*type:[[:space:]]*lightpanda([[:space:]]|$)' scripts/radar/blogs.yaml 2>/dev/null; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
            echo "---- lightpanda sources present ----"
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            echo "---- no lightpanda sources; rss-only ----"
          fi

      - name: Start Lightpanda + install puppeteer-core
        if: steps.lp.outputs.enabled == '1'
        run: |
          set -euo pipefail
          docker run -d --name lightpanda -p 127.0.0.1:9222:9222 lightpanda/browser:nightly
          bun add puppeteer-core
          # 等 CDP 端口就绪 (Lightpanda 暴露 ws://127.0.0.1:9222)
          for i in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/9222) 2>/dev/null; then echo "lightpanda CDP ready"; break; fi
            sleep 1
          done

      - name: Fetch blogger content
        id: blogs
        env:
          LIGHTPANDA_WS: ws://127.0.0.1:9222
        run: |
          set -euo pipefail
          # 失败不阻塞主路径 (blogger 是补充, 同 practices/trending)
          bun run scripts/radar/fetch-blogs.ts > radar-new-blogs.jsonl || true
          bc=$(grep -c . radar-new-blogs.jsonl 2>/dev/null || true); bc=${bc:-0}
          echo "bc=$bc" >> "$GITHUB_OUTPUT"
          echo "---- fetched $bc blogger item(s) ----"
          cat radar-new-blogs.jsonl 2>/dev/null || true

      - name: Stop Lightpanda
        if: always() && steps.lp.outputs.enabled == '1'
        run: docker rm -f lightpanda 2>/dev/null || true

      - name: Combine inputs
        id: combine
        run: |
          set -euo pipefail
          : > radar-input.jsonl
          [ -s radar-new-releases.jsonl ] && cat radar-new-releases.jsonl >> radar-input.jsonl || true
          [ -s radar-new-practices.jsonl ] && cat radar-new-practices.jsonl >> radar-input.jsonl || true
          [ -s radar-new-trending.jsonl ] && cat radar-new-trending.jsonl >> radar-input.jsonl || true
          [ -s radar-new-blogs.jsonl ] && cat radar-new-blogs.jsonl >> radar-input.jsonl || true
          # 同 practices 步骤: 避免 `grep -c` 空文件时 `|| echo 0` 双计数成多行破坏 $GITHUB_OUTPUT
          count=$(grep -c . radar-input.jsonl 2>/dev/null || true); count=${count:-0}
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "---- $count input line(s) combined ----"

      - name: Summarize via newapi
        if: steps.combine.outputs.count != '0'
        env:
          NEWAPI_TRIAL_TOKEN: ${{ secrets.NEWAPI_TRIAL_TOKEN }}
          NEWAPI_BASE_URL: https://newapi.lurus.cn
          RADAR_MODEL_ID: deepseek-v3-2-251201
        run: |
          set -euo pipefail
          if [ -z "${NEWAPI_TRIAL_TOKEN}" ]; then
            echo "::error::NEWAPI_TRIAL_TOKEN secret not set"
            exit 1
          fi
          bun run scripts/radar/summarize.ts < radar-input.jsonl

      # 播报音频不再在 CI 生成: 改本地 cron (scripts/radar/local-audio-cron.sh) 用
      # 自托管 CosyVoice2 出带情感的 mp3 (edge-tts 免费端点中文情感被微软永久屏蔽)。
      # CI 只快速上线文章; 本机 RTX 4070 随后补音频再部署一次。
      # tts-generate.ts (edge-tts) 保留为本地 cron 的 fallback。

      # 无条件跑 (内部 no-diff 自跳过): 即使 0 新条目, fetch 阶段的 state.json 推进
      # (标 seen 旧文/lastPolled) 也必须落库 — 否则下次 run 重复同一批工作。
      - name: Commit + push
        run: |
          set -euo pipefail
          git config user.name "c2m-radar-bot"
          git config user.email "radar-bot@claude2master.com"
          # Path filter (再次防御): 只 add 这些路径 (音频留本地 cron 补, 不在 CI 提交)
          git add src/content/changelog/ scripts/radar/state.json
          if git diff --staged --quiet; then
            echo "no diff staged, skipping commit"
            exit 0
          fi
          count="${{ steps.combine.outputs.count }}"
          git commit -m "chore(radar): auto-summarize ${count} new item(s)" \
                     -m "$(date -u +%Y-%m-%d) daily run · model deepseek-v3-2-251201"
          git push

      # 本项目 Vercel 未连 Git(故意如此, 见 vercel-no-git-autodeploy), git push 不触发构建。
      # 故用 token 显式 deploy(等价 ship.sh 的 bunx vercel --prod)。Deploy Hook 不可用——
      # 它需要 git-connected 项目。ORG/PROJECT ID 非机密(见 .vercel/project.json)。
      - name: Deploy to Vercel
        if: steps.combine.outputs.count != '0'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ezkPZttKyP7sc6xDZYsXkXs6
          VERCEL_PROJECT_ID: prj_dHEK2XIQ6Fh06StdAdn3ylTFLxg2
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::warning::VERCEL_TOKEN not set; content committed but site won't redeploy"
            exit 0
          fi
          bunx vercel deploy --prod --yes --token="$VERCEL_TOKEN" && echo "vercel production deploy done"

      - name: Notify wechatwork on failure
        if: failure() && env.WECHATWORK_WEBHOOK_URL != ''
        env:
          WECHATWORK_WEBHOOK_URL: ${{ secrets.WECHATWORK_WEBHOOK_URL }}
        run: |
          content="⚠️ **c2m daily-radar FAILED** ($(date -u +%Y-%m-%d))\n\nrun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(jq -nc --arg c "$content" '{msgtype: "markdown", markdown: {content: $c}}')
          curl -sf -X POST -H 'Content-Type: application/json' -d "$payload" "$WECHATWORK_WEBHOOK_URL" || echo "wechatwork push failed"
